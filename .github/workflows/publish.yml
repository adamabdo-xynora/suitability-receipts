name: publish-image
# Tag-triggered publish.
#
# The `test` stage ends at CMD ["uv", "run", "pytest"], which executes nothing
# at build time. It does carry `RUN uv run ruff check . && uv run ruff format
# --check . && uv run mypy --strict`, so a successful `--target test` build
# proves lint, format and types — and nothing whatsoever about the 334 tests or
# the 35 eval cases. Those are run below through `docker run`, each as its own
# step with no pipe and no `|| true`, so a nonzero exit fails the job directly.
#
# Stage names here are not the usual pair: the stages are uv, base, deps, test,
# prod-deps and runtime, and `runtime` is built from `prod-deps`, not from
# `test`.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  # Build provenance only. id-token mints the short-lived OIDC token that signs
  # the attestation; attestations writes the signed statement to this
  # repository. Both are scoped to this job alone — no other job in this repo
  # gains either, and nothing here reads a repository secret.
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # --load is required: under buildx the image otherwise stays in the
      # builder cache and is invisible to `docker run`. No `platforms` here on
      # purpose — the gate builds natively and runs the checks once rather
      # than twice under QEMU.
      - name: Build the test stage
        run: docker build --target test --load -t ci-test .

      # The suite needs no credential: the determination rules are pure
      # functions over documented data, and the two modules that call a model
      # are tested with a stub client.
      - name: Run the test suite inside the image
        run: docker run --rm ci-test uv run pytest

      - name: Run the eval set inside the image
        run: docker run --rm ci-test uv run python -m eval

      # The test stage already enforces both as a RUN. They get explicit steps
      # anyway: it keeps the gate honest if that RUN is ever removed, and it
      # puts each result in the run log as its own line rather than inside
      # build output.
      - name: Lint inside the image
        run: docker run --rm ci-test uv run ruff check .

      - name: Typecheck inside the image
        run: docker run --rm ci-test uv run mypy --strict src tests

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/adamabdo-xynora/${{ github.event.repository.name }}
          # A release tag is immutable; `latest` would drift off it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.description=Deterministic investment suitability determinations, or an explicit refusal. This image is an importable library layer: it carries the rules and their two dependencies, and has no entry point by design.

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The runtime stage has no CMD or ENTRYPOINT, by the design its own
          # Dockerfile comment sets out, and none is added here.
          target: runtime
          # Both arches so the documented `docker pull` works on arm64 laptops
          # without a --platform flag.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Signed provenance linking this exact digest to this workflow run and
      # commit. It runs after the push because it attests what was pushed:
      # subject-digest comes from the push step's own output rather than from
      # anything recomputed here, so the attestation cannot describe a
      # different image than the one in the registry. push-to-registry puts it
      # alongside the image, so `gh attestation verify oci://...` can find it
      # without this repository being consulted.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/adamabdo-xynora/${{ github.event.repository.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
